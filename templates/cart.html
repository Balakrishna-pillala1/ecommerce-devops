
<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>
    <h1>Your Shopping Cart</h1>

    {% if cart_items %}
        {% for item in cart_items %}
            <h3>{{ item.name }}</h3>
            <p>Price: ₹{{ item.price }}</p>
            <p>Quantity: {{ item.quantity }}</p>
            <p>Subtotal: ₹{{ item.subtotal }}</p>
            <hr>
        {% endfor %}

        <h2>Total: ₹{{ total }}</h2>
    {% else %}
        <p>Your cart is empty.</p>
    {% endif %}

    <a href="/">Continue Shopping</a>
</body>
</html>
